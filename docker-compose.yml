name: helpdesk

x-php: &php
  image: helpdesk-php:8.4
  user: "${UID:-1000}:${GID:-1000}"
  # O UID do host não existe no /etc/passwd da imagem, então o HOME seria "/" (sem permissão de escrita)
  environment:
    HOME: /tmp
  volumes:
    - .:/app

services:
  app:
    <<: *php
    build: ./docker
    container_name: helpdesk-app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    <<: *php
    container_name: helpdesk-queue
    command: php artisan queue:listen --tries=1
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: helpdesk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # 3306 no host já é usada pelo MySQL do multweb
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
